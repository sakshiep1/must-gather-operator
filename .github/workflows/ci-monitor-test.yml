name: ci-monitor-test

# Minimal CI workflow added solely to test the OAPE CI-Monitor tooling
# (openshift-eng/oape-ai-e2e#67) against this personal fork.
# Safe to remove once CI-Monitor testing is complete.

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          # Note: excludes vendor/ (not ours to format) and three pre-existing
          # files that show up as "unformatted" under some gofmt versions due
          # to gofmt style changes across Go releases (unrelated to this
          # sandbox's CI-Monitor testing). This keeps the check focused on
          # changes introduced by test branches.
          fmt_out="$(gofmt -l $(find . -name '*.go' \
            -not -path './vendor/*' \
            -not -path './api/v1alpha1/groupversion_info.go' \
            -not -path './controllers/mustgather/validation_test.go' \
            -not -path './tools.go'))"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
